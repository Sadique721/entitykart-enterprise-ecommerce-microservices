name: Return Service CI/CD

on:
  push:
    paths:
      - 'shared-lib/**'
      - 'return-service/**'
      - '.github/workflows/return-service-ci.yml'
    branches: [ main ]
  pull_request:
    paths:
      - 'shared-lib/**'
      - 'return-service/**'
      - '.github/workflows/return-service-ci.yml'
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.5

      - name: Build shared-lib
        working-directory: shared-lib
        run: ./gradlew publishToMavenLocal

      - name: Run Tests
        working-directory: return-service
        run: ./gradlew test

      - name: Build bootJar
        working-directory: return-service
        run: ./gradlew bootJar

      - name: Docker login
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v6
        with:
          context: ./return-service
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/return-service:latest
