# ─────────────────────────────────────────────────────────────────────────────
# EntityKart – Docker Compose v3.0 (Security hardened + Flyway + Log rotation)
# ─────────────────────────────────────────────────────────────────────────────

x-common-env: &common-env
  DB_HOST: ${DB_HOST}
  DB_PORT: ${DB_PORT}
  DB_USERNAME: ${DB_USERNAME}
  DB_PASSWORD: ${DB_PASSWORD}
  SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: 5
  SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9093
  EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://common-services:9900/eureka/
  SPRING_FLYWAY_BASELINE_ON_MIGRATE: "true"
  SPRING_FLYWAY_VALIDATE_ON_MIGRATE: "false"
  JAVA_TOOL_OPTIONS: "-XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0 -Djava.security.egd=file:/dev/./urandom"

x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

services:

  # ── Infrastructure ──────────────────────────────────────────────────────────

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: zookeeper_entitykart
    mem_limit: 256m
    cpus: 0.25
    environment:
      ZOOKEEPER_CLIENT_PORT: 9090
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "9090:9090"
    healthcheck:
      test: ["CMD-SHELL", "echo ruok | nc localhost 9090 || exit 0"]
      interval: 10s
      timeout: 5s
      retries: 5

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka_entitykart
    mem_limit: 512m
    cpus: 0.5
    depends_on:
      zookeeper:
        condition: service_healthy
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:9090
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9093,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9093,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    ports:
      - "9092:9092"
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 15s
      timeout: 10s
      retries: 10

  # ── Common Services (Gateway, Discovery, Notification) ──────────────────────

  common-services:
    build: ./common-services
    container_name: common-services_entitykart
    mem_limit: 768m
    cpus: 0.5
    ports:
      - "9900:9900"
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      SERVER_PORT: 9900
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: notification_service
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9093
      JWT_SECRET: ${JWT_SECRET}
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      APP_URL: http://localhost:9001
      SPRING_FLYWAY_BASELINE_ON_MIGRATE: "true"
      SPRING_FLYWAY_VALIDATE_ON_MIGRATE: "false"
      JAVA_TOOL_OPTIONS: "-XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0 -Djava.security.egd=file:/dev/./urandom"
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9900/actuator/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 15
      start_period: 180s
    restart: unless-stopped

  # ── Business Microservices ──────────────────────────────────────────────────

  user-service:
    build: ./user-service
    container_name: user-service_entitykart
    mem_limit: 512m
    cpus: 0.25
    ports:
      - "9902:9902"
    depends_on:
      kafka:
        condition: service_healthy
      common-services:
        condition: service_healthy
    environment:
      <<: *common-env
      DB_NAME: user_service
      SERVER_PORT: 9902
      JWT_SECRET: ${JWT_SECRET}
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      APP_URL: http://localhost:9001
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET}
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", "nc -z -w 2 localhost 9902 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 15
      start_period: 180s
    restart: unless-stopped

  product-service:
    build: ./product-service
    container_name: product-service_entitykart
    mem_limit: 512m
    cpus: 0.25
    ports:
      - "9903:9903"
    depends_on:
      kafka:
        condition: service_healthy
      common-services:
        condition: service_healthy
    environment:
      <<: *common-env
      DB_NAME: product_service
      SERVER_PORT: 9903
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET}
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", "nc -z -w 2 localhost 9903 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 15
      start_period: 180s
    restart: unless-stopped

  cart-service:
    build: ./cart-service
    container_name: cart-service_entitykart
    mem_limit: 512m
    cpus: 0.25
    ports:
      - "9904:9904"
    depends_on:
      kafka:
        condition: service_healthy
      common-services:
        condition: service_healthy
    environment:
      <<: *common-env
      DB_NAME: cart_service
      SERVER_PORT: 9904
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", "nc -z -w 2 localhost 9904 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 15
      start_period: 180s
    restart: unless-stopped

  order-service:
    build: ./order-service
    container_name: order-service_entitykart
    mem_limit: 512m
    cpus: 0.25
    ports:
      - "9905:9905"
    depends_on:
      kafka:
        condition: service_healthy
      common-services:
        condition: service_healthy
    environment:
      <<: *common-env
      DB_NAME: order_service
      SERVER_PORT: 9905
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", "nc -z -w 2 localhost 9905 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 15
      start_period: 180s
    restart: unless-stopped

  payment-service:
    build: ./payment-service
    container_name: payment-service_entitykart
    mem_limit: 512m
    cpus: 0.25
    ports:
      - "9906:9906"
    depends_on:
      kafka:
        condition: service_healthy
      common-services:
        condition: service_healthy
      order-service:
        condition: service_started
    environment:
      <<: *common-env
      DB_NAME: payment_service
      SERVER_PORT: 9906
      AUTHORIZE_NET_API_LOGIN_ID: ${AUTHORIZE_NET_API_LOGIN_ID}
      AUTHORIZE_NET_TRANSACTION_KEY: ${AUTHORIZE_NET_TRANSACTION_KEY}
      AUTHORIZE_NET_ENVIRONMENT: ${AUTHORIZE_NET_ENVIRONMENT}
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", "nc -z -w 2 localhost 9906 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 15
      start_period: 180s
    restart: unless-stopped

  wishlist-service:
    build: ./wishlist-service
    container_name: wishlist-service_entitykart
    mem_limit: 512m
    cpus: 0.25
    ports:
      - "9907:9907"
    depends_on:
      common-services:
        condition: service_healthy
    environment:
      <<: *common-env
      DB_NAME: wishlist_service
      SERVER_PORT: 9907
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", "nc -z -w 2 localhost 9907 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 15
      start_period: 180s
    restart: unless-stopped

  review-service:
    build: ./review-service
    container_name: review-service_entitykart
    mem_limit: 512m
    cpus: 0.25
    ports:
      - "9908:9908"
    depends_on:
      common-services:
        condition: service_healthy
    environment:
      <<: *common-env
      DB_NAME: review_service
      SERVER_PORT: 9908
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", "nc -z -w 2 localhost 9908 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 15
      start_period: 180s
    restart: unless-stopped

  return-service:
    build: ./return-service
    container_name: return-service_entitykart
    mem_limit: 512m
    cpus: 0.25
    ports:
      - "9909:9909"
    depends_on:
      kafka:
        condition: service_healthy
      common-services:
        condition: service_healthy
      order-service:
        condition: service_started
      payment-service:
        condition: service_started
    environment:
      <<: *common-env
      DB_NAME: return_service
      SERVER_PORT: 9909
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", "nc -z -w 2 localhost 9909 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 15
      start_period: 180s
    restart: unless-stopped

  # ── Nginx Web Server (Frontend) ─────────────────────────────────────────────

  nginx:
    image: nginx:alpine
    container_name: nginx_entitykart
    mem_limit: 128m
    cpus: 0.2
    ports:
      - "9001:9001"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      common-services:
        condition: service_healthy
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:9001/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped
