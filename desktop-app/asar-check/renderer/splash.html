<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 520px; height: 320px; overflow: hidden; background: transparent; }
  body {
    background: #0d1117;
    border-radius: 12px;
    border: 1px solid #30363d;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 18px;
    font-family: 'Segoe UI', -apple-system, sans-serif;
    position: relative;
    overflow: hidden;
  }
  /* Glow orb background */
  body::before {
    content: '';
    position: absolute;
    top: -60px; left: 50%; transform: translateX(-50%);
    width: 300px; height: 200px;
    background: radial-gradient(ellipse, rgba(88,166,255,.25) 0%, transparent 70%);
    border-radius: 50%;
    pointer-events: none;
  }
  .logo {
    width: 64px; height: 64px;
    background: linear-gradient(135deg, #58a6ff, #7ee787);
    border-radius: 16px;
    display: flex; align-items: center; justify-content: center;
    font-size: 26px; font-weight: 900; color: #0d1117;
    box-shadow: 0 0 30px rgba(88,166,255,.4);
    animation: breathe 2s ease-in-out infinite;
  }
  @keyframes breathe {
    0%,100% { box-shadow: 0 0 20px rgba(88,166,255,.4); }
    50%      { box-shadow: 0 0 40px rgba(88,166,255,.7); }
  }
  .title { font-size: 22px; font-weight: 700; color: #e6edf3; letter-spacing: -0.5px; }
  .sub   { font-size: 13px; color: #8b949e; }
  .bar-wrap {
    width: 200px; height: 3px;
    background: #21262d; border-radius: 2px; overflow: hidden;
  }
  .bar {
    height: 100%; width: 0%;
    background: linear-gradient(90deg, #58a6ff, #7ee787);
    border-radius: 2px;
    animation: load 2.2s ease-in-out forwards;
  }
  @keyframes load { from { width: 0% } to { width: 100% } }
  .version { position: absolute; bottom: 14px; right: 18px; font-size: 11px; color: #30363d; }
</style>
</head>
<body>
  <div class="logo">EK</div>
  <div class="title">EntityKart</div>
  <div class="sub">Starting Control Panel...</div>
  <div class="bar-wrap"><div class="bar"></div></div>
  <div class="version">v1.0.0</div>
</body>
</html>
