worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include      /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile     on;
    keepalive_timeout 65;

    # ── Rate Limiting Zones ────────────────────────────────────────────────────
    # General API rate: 10 requests/sec per IP, burst 20
    limit_req_zone $binary_remote_addr zone=api_limit:10m  rate=10r/s;
    # Login rate:      3 requests/min per IP, burst 5 (brute-force protection)
    limit_req_zone $binary_remote_addr zone=login_limit:5m rate=3r/m;

    # ── Gzip compression ───────────────────────────────────────────────────────
    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml application/xml+rss text/javascript;
    gzip_min_length 256;
    gzip_comp_level 6;
    gzip_proxied    any;
    gzip_vary       on;

    # ── Upstream: Spring Cloud Gateway (common-services:9900) ─────────────────
    upstream api_gateway {
        server common-services:9900;
        keepalive 8;
    }

    server {
        listen 9001;
        server_name localhost;

        # ── Security Headers ───────────────────────────────────────────────────
        add_header X-Frame-Options            "DENY"                            always;
        add_header X-Content-Type-Options     "nosniff"                         always;
        add_header X-XSS-Protection           "1; mode=block"                   always;
        add_header Referrer-Policy            "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security  "max-age=31536000; includeSubDomains" always;
        add_header Permissions-Policy         "geolocation=(), microphone=()"   always;
        add_header Content-Security-Policy    "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdnjs.cloudflare.com https://ajax.googleapis.com https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdnjs.cloudflare.com; font-src 'self' https://fonts.gstatic.com https://cdnjs.cloudflare.com; img-src 'self' data: https://res.cloudinary.com blob: https://*; connect-src 'self' http://localhost:9001 http://localhost:9900 https://*; frame-ancestors 'none';" always;

        # ── Static Frontend ────────────────────────────────────────────────────
        location / {
            root  /usr/share/nginx/html;
            index index.html;
            try_files $uri $uri/ /index.html;

            # Cache static assets
            location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
                expires -1;
                add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
                add_header X-Frame-Options        "DENY"    always;
                add_header X-Content-Type-Options "nosniff" always;
            }
        }

        # ── Login endpoint — strict rate limiting ──────────────────────────────
        location = /api/users/login {
            limit_req zone=login_limit burst=5 nodelay;
            limit_req_status 429;

            proxy_pass         http://api_gateway;
            proxy_http_version 1.1;
            proxy_set_header   Connection "";
            proxy_set_header   Host               $host;
            proxy_set_header   X-Real-IP          $remote_addr;
            proxy_set_header   X-Forwarded-For    $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto  $scheme;

            add_header Access-Control-Allow-Origin      $http_origin  always;
            add_header Access-Control-Allow-Methods     "POST, OPTIONS" always;
            add_header Access-Control-Allow-Headers     "Authorization, Content-Type, Accept" always;
            add_header Access-Control-Allow-Credentials "true" always;

            if ($request_method = OPTIONS) {
                add_header Access-Control-Allow-Origin      $http_origin;
                add_header Access-Control-Allow-Methods     "POST, OPTIONS";
                add_header Access-Control-Allow-Headers     "Authorization, Content-Type, Accept";
                add_header Access-Control-Allow-Credentials "true";
                add_header Content-Length 0;
                add_header Content-Type   text/plain;
                return 204;
            }
        }

        # ── Registration — moderate rate limiting ──────────────────────────────
        location = /api/users/register {
            limit_req zone=login_limit burst=10 nodelay;
            limit_req_status 429;

            proxy_pass         http://api_gateway;
            proxy_http_version 1.1;
            proxy_set_header   Connection "";
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;

            add_header Access-Control-Allow-Origin      $http_origin  always;
            add_header Access-Control-Allow-Methods     "POST, OPTIONS" always;
            add_header Access-Control-Allow-Headers     "Authorization, Content-Type, Accept" always;
            add_header Access-Control-Allow-Credentials "true" always;

            if ($request_method = OPTIONS) {
                add_header Content-Length 0;
                add_header Content-Type   text/plain;
                return 204;
            }
        }

        # ── General API Proxy ──────────────────────────────────────────────────
        location /api/ {
            limit_req zone=api_limit burst=20 nodelay;
            limit_req_status 429;

            proxy_pass         http://api_gateway;
            proxy_http_version 1.1;
            proxy_set_header   Connection "";
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;

            # CORS
            add_header Access-Control-Allow-Origin      $http_origin  always;
            add_header Access-Control-Allow-Methods     "GET, POST, PUT, DELETE, PATCH, OPTIONS" always;
            add_header Access-Control-Allow-Headers     "Authorization, Content-Type, Accept, X-Requested-With" always;
            add_header Access-Control-Allow-Credentials "true" always;

            if ($request_method = OPTIONS) {
                add_header Access-Control-Allow-Origin      $http_origin;
                add_header Access-Control-Allow-Methods     "GET, POST, PUT, DELETE, PATCH, OPTIONS";
                add_header Access-Control-Allow-Headers     "Authorization, Content-Type, Accept, X-Requested-With";
                add_header Access-Control-Allow-Credentials "true";
                add_header Content-Length 0;
                add_header Content-Type   text/plain;
                return 204;
            }

            proxy_read_timeout    120s;
            proxy_connect_timeout 60s;
            proxy_send_timeout    60s;

            proxy_intercept_errors on;
            error_page 502 503 504 = @api_error;
        }

        # ── Health checks ──────────────────────────────────────────────────────
        location = /actuator/health {
            add_header Content-Type              "application/json" always;
            add_header Access-Control-Allow-Origin "*"             always;
            return 200 '{"status":"UP"}';
        }

        location = /api/health {
            add_header Content-Type              "application/json" always;
            add_header Access-Control-Allow-Origin "*"             always;
            return 200 '{"status":"UP","service":"entitykart"}';
        }

        # ── Actuator — restrict to localhost only ──────────────────────────────
        location /actuator/ {
            allow 127.0.0.1;
            allow 172.16.0.0/12;   # Docker bridge network
            deny  all;

            proxy_pass         http://api_gateway;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 60s;
        }

        # ── Eureka / Discovery — restrict to internal access ───────────────────
        location /eureka/ {
            allow 127.0.0.1;
            allow 172.16.0.0/12;
            deny  all;

            proxy_pass http://api_gateway/eureka/;
            proxy_set_header Host             $host;
            proxy_set_header X-Real-IP        $remote_addr;
            proxy_set_header X-Forwarded-For  $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /discovery/ {
            allow 127.0.0.1;
            allow 172.16.0.0/12;
            deny  all;

            proxy_pass http://api_gateway/;
            proxy_set_header Host             $host;
            proxy_set_header X-Real-IP        $remote_addr;
            proxy_set_header X-Forwarded-For  $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ── Friendly error handler ─────────────────────────────────────────────
        location @api_error {
            add_header Content-Type               "application/json" always;
            add_header Access-Control-Allow-Origin "*"              always;
            return 503 '{"status":503,"error":"Service Unavailable","message":"The backend service is temporarily unavailable. Please retry in 30 seconds."}';
        }
    }
}
