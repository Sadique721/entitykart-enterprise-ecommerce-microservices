# ============================================================
#  Common Services — Merged: API-Gateway + Discovery-Server
#                            + Common-Service + Notification-Service
#  Port Layout:
#    9900 → Eureka Discovery Server (main HTTP port)
#    The gateway & notification REST run inside the same process
#    on port 9900 via Spring MVC
# ============================================================
server:
  port: ${SERVER_PORT:9900}

spring:
  application:
    name: common-services
  main:
    web-application-type: servlet

  # ── Multipart (for gateway file-upload passthrough) ──────────────────────────
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  # ── Database (Notification entity persistence) ────────────────────────────────
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:defaultdb}?useSSL=true&requireSSL=true&trustServerCertificate=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:0721}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
        jdbc:
          time_zone: UTC

  # ── Flyway ──────────────────────────────────────────────────────────────────
  flyway:
    enabled: true
    baseline-on-migrate: ${SPRING_FLYWAY_BASELINE_ON_MIGRATE:true}
    baseline-version: 0
    validate-on-migrate: false
    locations: classpath:db/migration

  # ── Kafka (Notification consumers) ──────────────────────────────────────────
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: common-services-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: >
          com.entitykart.*,
          com.entitykart.commonservices.notification.dto,
          com.entitykart.userservice.event,
          com.entitykart.orderservice.dto,
          com.entitykart.orderservice.event,
          com.entitykart.paymentservice.dto,
          com.entitykart.paymentservice.event,
          com.entitykart.returnservice.dto,
          com.entitykart.returnservice.event,
          com.entitykart.cartservice.dto
        spring.json.use.type.headers: false
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: false

  # ── Email / SMTP ─────────────────────────────────────────────────────────────
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
        connectiontimeout: 5000
        timeout: 3000
        writetimeout: 5000

  # ── Spring Cloud Gateway Routes ───────────────────────────────────────────────
  cloud:
    gateway:
      mvc:
        routes:
          # ── User Service (includes /api/users/sessions, /refresh-token) ──────
          - id: user-service
            uri: lb://user-service
            predicates:
              - Path=/api/users,/api/users/**
            filters:
              - name: CircuitBreaker
                args:
                  id: userServiceCircuitBreaker
                  fallbackUri: forward:/fallback/user-service

          # ── Product Service ──────────────────────────────────────────────────
          - id: product-service-products
            uri: lb://product-service
            predicates:
              - Path=/api/products,/api/products/**
            filters:
              - name: CircuitBreaker
                args:
                  id: productServiceCircuitBreaker
                  fallbackUri: forward:/fallback/product-service

          # ── Category Service (part of product-service) ───────────────────────
          - id: product-service-categories
            uri: lb://product-service
            predicates:
              - Path=/api/categories,/api/categories/**
            filters:
              - name: CircuitBreaker
                args:
                  id: productServiceCircuitBreaker
                  fallbackUri: forward:/fallback/product-service

          # ── Cart Service ─────────────────────────────────────────────────────
          - id: cart-service
            uri: lb://cart-service
            predicates:
              - Path=/api/cart,/api/cart/**
            filters:
              - name: CircuitBreaker
                args:
                  id: cartServiceCircuitBreaker
                  fallbackUri: forward:/fallback/cart-service

          # ── Order Service ────────────────────────────────────────────────────
          - id: order-service
            uri: lb://order-service
            predicates:
              - Path=/api/orders,/api/orders/**
            filters:
              - name: CircuitBreaker
                args:
                  id: orderServiceCircuitBreaker
                  fallbackUri: forward:/fallback/order-service

          # ── Payment Service ──────────────────────────────────────────────────
          - id: payment-service
            uri: lb://payment-service
            predicates:
              - Path=/api/payments,/api/payments/**
            filters:
              - name: CircuitBreaker
                args:
                  id: paymentServiceCircuitBreaker
                  fallbackUri: forward:/fallback/payment-service

          # ── Wishlist Service ─────────────────────────────────────────────────
          - id: wishlist-service
            uri: lb://wishlist-service
            predicates:
              - Path=/api/wishlist,/api/wishlist/**
            filters:
              - name: CircuitBreaker
                args:
                  id: wishlistServiceCircuitBreaker
                  fallbackUri: forward:/fallback/wishlist-service

          # ── Review Service (public GET + admin) ──────────────────────────────
          - id: review-service
            uri: lb://review-service
            predicates:
              - Path=/api/reviews,/api/reviews/**,/api/admin/reviews,/api/admin/reviews/**
            filters:
              - name: CircuitBreaker
                args:
                  id: reviewServiceCircuitBreaker
                  fallbackUri: forward:/fallback/review-service

          # ── Return Service ───────────────────────────────────────────────────
          - id: return-service
            uri: lb://return-service
            predicates:
              - Path=/api/returns,/api/returns/**,/api/admin/returns,/api/admin/returns/**
            filters:
              - name: CircuitBreaker
                args:
                  id: returnServiceCircuitBreaker
                  fallbackUri: forward:/fallback/return-service

          # ── Admin Notifications & Export — served locally (no lb routing) ────
          # These endpoints live inside common-services itself; no forwarding needed.
          # Spring MVC will handle /api/admin/notifications/** and /api/admin/export/**
          # directly via NotificationController and AdminExportController.
          # DO NOT add lb routes for them — they will loop.


# ── Eureka Server (self — Discovery) ─────────────────────────────────────────
eureka:
  instance:
    hostname: ${EUREKA_HOSTNAME:localhost}
    prefer-ip-address: true
  client:
    # This service IS the Eureka server — do not register with itself
    register-with-eureka: false
    fetch-registry: true
    service-url:
      defaultZone: http://${eureka.instance.hostname}:${SERVER_PORT:9900}/eureka/
  server:
    wait-time-in-ms-when-sync-empty: 0
    response-cache-update-interval-ms: 5000

# ── JWT (used by the embedded Gateway filter) ─────────────────────────────────
jwt:
  secret: ${JWT_SECRET}

# ── App meta (Notification service helpers) ───────────────────────────────────
app:
  admin-email: ${ADMIN_EMAIL:admin@entitykart.com}
  frontend-url: ${APP_URL:http://localhost:9901}

# ── Logging ───────────────────────────────────────────────────────────────────
logging:
  level:
    com.entitykart: INFO
    com.netflix.eureka: WARN
    com.netflix.discovery: WARN
    org.springframework.mail: INFO

# ── Management / Actuator ─────────────────────────────────────────────────────
management:
  health:
    mail:
      enabled: false

# ── Resilience4j Circuit Breaker & Timeout Configuration ──────────────────────
resilience4j:
  timelimiter:
    configs:
      default:
        timeout-duration: 10s
  circuitbreaker:
    configs:
      default:
        sliding-window-size: 10
        permitted-number-of-calls-in-half-open-state: 2
        sliding-window-type: COUNT_BASED
        minimum-number-of-calls: 5
        wait-duration-in-open-state: 5s
        failure-rate-threshold: 50
        event-consumer-buffer-size: 10

# ── Gateway Security Configuration ─────────────────────────────────────────────
gateway:
  # Issue 2 fix: explicit CORS allow-list.
  # Set CORS_ALLOWED_ORIGINS env var to a comma-separated list of real frontend
  # origins in production (e.g. "https://entitykart.com,https://admin.entitykart.com").
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:9901,http://localhost:3000}

  # Issue 6 fix: IP address of the trusted reverse proxy in front of this gateway.
  # When set, X-Forwarded-For is trusted only if the physical request comes from this IP.
  # Leave blank (default) to disable XFF trust and always use the TCP remote address.
  trusted-proxy: ${GATEWAY_TRUSTED_PROXY:}
